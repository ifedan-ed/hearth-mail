# Hearth Mail on GitHub Actions, in the public mirror
# (tools/export/public-mirror.sh; docs/building.md).
#
# - Every push and pull request: formatting, clippy, the server build, and
#   the unit tests of the crates the change touches (ci/changed-crates.py;
#   everything when Cargo.toml, Cargo.lock, vendor/ or ci/ changed).
# - On demand (workflow_dispatch) and for a release tag (v*): the whole
#   workspace's unit tests and the integration suites (the tests crate),
#   as docs/building.md lists them.
#
# The toolchain is the one ci/builder.Dockerfile pins (Rust 1.100.0 with
# clang and libclang for RocksDB's bindings). Builds are cached with
# Swatinem/rust-cache.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "8388608"

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/rust:1.100.0-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          apt-get update -q && apt-get install -yq --no-install-recommends clang libclang-19-dev cmake python3
          rustup component add rustfmt clippy
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: The console schema
        run: |
          python3 tools/fork/expr-schema.py --check
          python3 tools/fork/privacy-check.py
      - name: Clippy
        # smtp's tests need its test_mode feature (docs/building.md).
        run: cargo clippy --workspace --exclude tests --locked --tests --features smtp/test_mode
      - name: Build the server
        run: cargo build -p inbuxa --locked
      - name: Tests of the changed crates
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          changed="$(python3 ci/changed-crates.py "$base")"
          echo "Changed: ${changed:-nothing}"
          if [ "$changed" = "ALL" ]; then
            cargo test --workspace --exclude tests --locked --features smtp/test_mode
          elif [ -n "$changed" ]; then
            args=""
            for package in $changed; do args="$args -p $package"; done
            # smtp's tests need its test_mode feature.
            case " $changed " in *" smtp "*) args="$args --features smtp/test_mode" ;; esac
            cargo test $args --locked
          fi

  full:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: docker.io/library/rust:1.100.0-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: apt-get update -q && apt-get install -yq --no-install-recommends clang libclang-19-dev cmake python3
      - uses: Swatinem/rust-cache@v2
      - name: Library tests
        run: cargo test --workspace --exclude tests --locked --features smtp/test_mode
      # As .forgejo/workflows/ci.yml and docs/building.md: the suites that
      # need containers, a coordinator, or fail on upstream's code too are
      # left out.
      - name: Integration suites
        env:
          STORE: RocksDb
        run: |
          cargo test -p tests --locked -- --test-threads=1 \
            --skip automation::automation_tests \
            --skip cluster:: \
            --skip directory::directory_tests \
            --skip imap::imap_tests
