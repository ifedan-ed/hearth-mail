<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 716.38" width="400" height="716.38" role="img" aria-label="An ActiveSync device from setup to push" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>An ActiveSync device from setup to push</title><desc>The person types an email address and password. Autodiscover (POX, SOAP or JSON) gives the ActiveSync address. OPTIONS lists versions 14.1 and 16.1; Provision hands over a policy; FolderSync lists mail folders, calendars, address books, task lists and notes; Sync brings each folder up to date; Ping then waits until something changes, and the device syncs that folder and pings again.</desc><rect x="0" y="0" width="400" height="716.38" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">An ActiveSync device from setup to push</text><g transform="translate(0 40.75)"><path d="M200 51.25L200 74.26" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,81.25 195.63,72.51 204.37,72.51" fill="#5b6573" stroke-linejoin="round"/><path d="M200 161.75L200 184.76" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,191.75 195.63,183.01 204.37,183.01" fill="#5b6573" stroke-linejoin="round"/><path d="M200 241L200 264.01" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,271 195.63,262.26 204.37,262.26" fill="#5b6573" stroke-linejoin="round"/><path d="M200 320.25L200 343.26" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,350.25 195.63,341.51 204.37,341.51" fill="#5b6573" stroke-linejoin="round"/><path d="M200 399.5L200 422.51" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,429.5 195.63,420.76 204.37,420.76" fill="#5b6573" stroke-linejoin="round"/><path d="M200 478.75L200 501.76" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,508.75 195.63,500.01 204.37,500.01" fill="#5b6573" stroke-linejoin="round"/><path d="M54.15 627.19L45.15 627.19Q38.15 627.19 38.15 620.19L38.15 540.38Q38.15 533.38 45.15 533.38L117.78 533.38" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="124.77,533.38 116.03,537.75 116.03,529.01" fill="#5b6573" stroke-linejoin="round"/><path d="M345.85 627.19L354.85 627.19Q361.85 627.19 361.85 620.19L361.85 540.38Q361.85 533.38 354.85 533.38L282.22 533.38" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="275.23,533.38 283.97,529.01 283.97,537.75" fill="#5b6573" stroke-linejoin="round"/><path d="M200 558L200 571.75Q200 578.75 193 578.75L126 578.75Q121.5 578.75 121.5 583.25L121.5 587.76" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="121.5,594.75 117.13,586.01 125.87,586.01" fill="#5b6573" stroke-linejoin="round"/><path d="M200 558L200 571.75Q200 578.75 207 578.75L274 578.75Q278.5 578.75 278.5 583.25L278.5 587.76" fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="278.5,594.75 274.13,586.01 282.87,586.01" fill="#5b6573" stroke-linejoin="round"/><rect x="92.55" y="2" width="214.9" height="49.25" rx="17" fill="#e6ebf2" stroke="#1d232b" stroke-width="1.4"/><text x="200" y="23.19" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Email address and password</text><text x="200" y="38.81" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">typed on the device</text><rect x="84.14" y="81.25" width="231.71" height="80.5" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="200" y="102.44" font-size="12.5" fill="#1d232b" text-anchor="middle">Autodiscover (POX, SOAP or JSON)</text><text x="200" y="118.06" font-size="12.5" fill="#1d232b" text-anchor="middle">answers with</text><text x="200" y="133.69" font-size="12.5" fill="#1d232b" text-anchor="middle">https://&lt;host&gt;/Microsoft-Server-</text><text x="200" y="149.31" font-size="12.5" fill="#1d232b" text-anchor="middle">ActiveSync</text><rect x="114.77" y="191.75" width="170.45" height="49.25" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="200" y="212.94" font-size="12.5" fill="#1d232b" text-anchor="middle">OPTIONS: versions 14.1</text><text x="200" y="228.56" font-size="12.5" fill="#1d232b" text-anchor="middle">and 16.1, the commands</text><rect x="129.37" y="271" width="141.25" height="49.25" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="200" y="292.19" font-size="12.5" fill="#1d232b" text-anchor="middle">Provision: a policy</text><text x="200" y="307.81" font-size="12.5" fill="#1d232b" text-anchor="middle">without device rules</text><rect x="82.7" y="350.25" width="234.61" height="49.25" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="200" y="371.44" font-size="12.5" fill="#1d232b" text-anchor="middle">FolderSync: mail folders, calendars,</text><text x="200" y="387.06" font-size="12.5" fill="#1d232b" text-anchor="middle">address books, task lists, notes</text><rect x="82.54" y="429.5" width="234.92" height="49.25" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="200" y="450.69" font-size="12.5" fill="#1d232b" text-anchor="middle">Sync each folder: mail from Hearth</text><text x="200" y="466.31" font-size="12.5" fill="#1d232b" text-anchor="middle">Mail&#39;s store, the rest from Nextcloud</text><polygon points="124.77,533.38 137.77,508.75 262.23,508.75 275.23,533.38 262.23,558 137.77,558" fill="#d6e6f5" stroke="#1f6fb2" stroke-width="1.4" stroke-linejoin="round"/><text x="200" y="529.94" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">Ping waits up</text><text x="200" y="545.56" font-size="12.5" fill="#1d232b" text-anchor="middle" font-weight="700">to the heartbeat</text><rect x="54.15" y="594.75" width="134.7" height="64.88" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="121.5" y="623.75" font-size="12.5" fill="#1d232b" text-anchor="middle">Sync the folders</text><text x="121.5" y="639.38" font-size="12.5" fill="#1d232b" text-anchor="middle">Ping named</text><rect x="211.15" y="594.75" width="134.7" height="64.88" rx="6" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.2"/><text x="278.5" y="615.94" font-size="12.5" fill="#1d232b" text-anchor="middle">Answer: nothing</text><text x="278.5" y="631.56" font-size="12.5" fill="#1d232b" text-anchor="middle">changed; the</text><text x="278.5" y="647.19" font-size="12.5" fill="#1d232b" text-anchor="middle">device pings again</text><text x="165.61" y="574.73" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">Changes</text><text x="165.61" y="574.73" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">Changes</text><text x="250.44" y="574.73" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">Heartbeat over</text><text x="250.44" y="574.73" font-size="11" fill="#1d232b" text-anchor="middle" font-weight="700">Heartbeat over</text></g></svg>