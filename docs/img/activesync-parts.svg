ext x="85.59" y="228.85" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">mail</text><text x="85.59" y="228.85" font-size="11" fill="#1d232b" text-anchor="middle">mail</text><rect x="233.69" y="219.13" width="95.31" height="11.75" rx="3" fill="#ffffff"/><text x="281.35" y="228.85" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">the other classes</text><text x="281.35" y="228.85" font-size="11" fill="#1d232b" text-anchor="middle">the other classes</text><rect x="224.73" y="392.13" width="104.27" height="11.75" rx="3" fill="#ffffff"/><text x="276.87" y="401.85" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">CalDAV, CardDAV</text><text x="276.87" y="401.85" font-size="11" fill="#1d232b" text-anchor="middle">CalDAV, CardDAV</text></g></svg>