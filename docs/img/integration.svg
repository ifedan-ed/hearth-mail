<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475.75" width="400" height="475.75" role="img" aria-label="Hearth Mail and the cloud" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif"><title>Hearth Mail and the cloud</title><desc>Mail apps reach Hearth Mail over IMAP, SMTP and JMAP and the cloud over CalDAV and CardDAV. Web mail (Tidings in Nextcloud now, Hearth later) uses Hearth Mail over JMAP with push, and the cloud&#39;s contacts, calendars and files in process. Hearth Mail asks the cloud only one thing: whether a sender is in the recipient&#39;s contacts.</desc><rect x="0" y="0" width="400" height="475.75" fill="#ffffff"/><text x="14" y="28.63" font-size="15" fill="#1d232b" font-weight="700">Hearth Mail and the cloud</text><g transform="translate(0 40.75)"><rect x="154.37" y="2" width="91.25" height="82" rx="12" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.3"/><text x="200" y="24.7" font-size="12" fill="#1d232b" text-anchor="middle">Mail apps:</text><text x="200" y="39.7" font-size="12" fill="#1d232b" text-anchor="middle">phones,</text><text x="200" y="54.7" font-size="12" fill="#1d232b" text-anchor="middle">Thunderbird,</text><text x="200" y="69.7" font-size="12" fill="#1d232b" text-anchor="middle">Apple Mail</text><rect x="14" y="162" width="91.25" height="112" rx="3" fill="#d9f0e2" stroke="#1d8a4e" stroke-width="1.3"/><text x="59.63" y="184.7" font-size="12" fill="#1d232b" text-anchor="middle">Hearth</text><text x="59.63" y="199.7" font-size="12" fill="#1d232b" text-anchor="middle">Mail: IMAP,</text><text x="59.63" y="214.7" font-size="12" fill="#1d232b" text-anchor="middle">SMTP,</text><text x="59.63" y="229.7" font-size="12" fill="#1d232b" text-anchor="middle">JMAP,</text><text x="59.63" y="244.7" font-size="12" fill="#1d232b" text-anchor="middle">Sieve,</text><text x="59.63" y="259.7" font-size="12" fill="#1d232b" text-anchor="middle">spam filter</text><rect x="294.75" y="162" width="91.25" height="112" rx="3" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.3"/><text x="340.37" y="184.7" font-size="12" fill="#1d232b" text-anchor="middle">Nextcloud</text><text x="340.37" y="199.7" font-size="12" fill="#1d232b" text-anchor="middle">now, Hearth</text><text x="340.37" y="214.7" font-size="12" fill="#1d232b" text-anchor="middle">later:</text><text x="340.37" y="229.7" font-size="12" fill="#1d232b" text-anchor="middle">calendars,</text><text x="340.37" y="244.7" font-size="12" fill="#1d232b" text-anchor="middle">contacts,</text><text x="340.37" y="259.7" font-size="12" fill="#1d232b" text-anchor="middle">files</text><rect x="154.37" y="352" width="91.25" height="67" rx="12" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.3"/><text x="200" y="374.7" font-size="12" fill="#1d232b" text-anchor="middle">Web mail:</text><text x="200" y="389.7" font-size="12" fill="#1d232b" text-anchor="middle">Tidings now,</text><text x="200" y="404.7" font-size="12" fill="#1d232b" text-anchor="middle">Hearth later</text><path d="M154.37 43L66.63 43Q59.63 43 59.63 50L59.63 154.75" fill="none" stroke="#1d232b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><polygon points="59.63,162 55.1,152.94 64.16,152.94" fill="#1d232b" stroke-linejoin="round"/><path d="M245.63 43L333.37 43Q340.37 43 340.37 50L340.37 154.75" fill="none" stroke="#1d232b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><polygon points="340.37,162 335.84,152.94 344.9,152.94" fill="#1d232b" stroke-linejoin="round"/><path d="M105.25 218L287.5 218" fill="none" stroke="#1d232b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="294.75,218 285.69,222.53 285.69,213.47" fill="#1d232b" stroke-linejoin="round"/><path d="M154.37 385.5L66.63 385.5Q59.63 385.5 59.63 378.5L59.63 281.25" fill="none" stroke="#1d232b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><polygon points="59.63,274 64.16,283.06 55.1,283.06" fill="#1d232b" stroke-linejoin="round"/><path d="M245.63 385.5L333.37 385.5Q340.37 385.5 340.37 378.5L340.37 281.25" fill="none" stroke="#1d232b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><polygon points="340.37,274 344.9,283.06 335.84,283.06" fill="#1d232b" stroke-linejoin="round"/><rect x="62.63" y="96.63" width="111.97" height="11.75" rx="3" fill="#ffffff"/><text x="118.61" y="106.35" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">IMAP, SMTP, JMAP</text><text x="118.61" y="106.35" font-size="11" fill="#1d232b" text-anchor="middle">IMAP, SMTP, JMAP</text><rect x="233.11" y="96.63" width="104.27" height="11.75" rx="3" fill="#ffffff"/><text x="285.24" y="106.35" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">CalDAV, CardDAV</text><text x="285.24" y="106.35" font-size="11" fill="#1d232b" text-anchor="middle">CalDAV, CardDAV</text><rect x="155.88" y="202.25" width="88.25" height="11.75" rx="3" fill="#ffffff"/><text x="200" y="211.98" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">contacts lookup</text><text x="200" y="211.98" font-size="11" fill="#1d232b" text-anchor="middle">contacts lookup</text><rect x="62.63" y="323.88" width="77.01" height="11.75" rx="3" fill="#ffffff"/><text x="101.13" y="333.6" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">JMAP + push</text><text x="101.13" y="333.6" font-size="11" fill="#1d232b" text-anchor="middle">JMAP + push</text><rect x="276.74" y="323.88" width="60.63" height="11.75" rx="3" fill="#ffffff"/><text x="307.06" y="333.6" font-size="11" fill="#ffffff" text-anchor="middle" stroke="#ffffff" stroke-width="3.08" stroke-linejoin="round">in process</text><text x="307.06" y="333.6" font-size="11" fill="#1d232b" text-anchor="middle">in process</