# Unbound for Hearth Mail: a full recursive, validating resolver that only
# the mail server asks. Why it ships with Hearth Mail: deploy/compose/README.md.
#
# It resolves from the root itself (forwarding to nobody), validates DNSSEC,
# and keeps the root trust anchor current by itself (RFC 5011). DNS
# blocklists answer it, because its queries come from this host rather than
# a shared public resolver they refuse.
server:
    # Foreground, logging to stderr (Docker keeps it).
    do-daemonize: no
    username: ""
    chroot: ""
    pidfile: ""
    logfile: ""
    use-syslog: no
    # The image's /var/unbound, kept in a named volume: it starts with the
    # root hints and a seed root key, and the key is updated in place.
    directory: "/var/unbound"
    verbosity: 1
    # One line for each answer that fails DNSSEC validation, and each SERVFAIL.
    val-log-level: 2
    log-servfail: yes

    # Not published on the host: only containers on its network reach it,
    # and only from private addresses.
    interface: 0.0.0.0
    interface: ::0
    port: 53
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: fd00::/8 allow

    do-ip4: yes
    do-ip6: yes
    prefer-ip6: no
    do-udp: yes
    do-tcp: yes
    root-hints: "/var/unbound/root.hints"
    edns-buffer-size: 1232

    # DNSSEC: strict validation, a self-updating root key, qname minimisation.
    auto-trust-anchor-file: "/var/unbound/root.key"
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-glue: yes
    harden-referral-path: no
    harden-algo-downgrade: yes
    aggressive-nsec: yes
    qname-minimisation: yes
    qname-minimisation-strict: no
    use-caps-for-id: no
    hide-identity: yes
    hide-version: yes

    # A small cache: one mail server's lookups.
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 32m
    key-cache-size: 4m
    neg-cache-size: 2m
    cache-min-ttl: 0
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: no
    outgoing-range: 1024
    num-queries-per-thread: 512
    so-reuseport: no

    # DNS rebinding guard: private addresses are never accepted in answers
    # from the internet. 127.0.0.0/8 is left out on purpose: blocklists
    # answer with 127.0.0.x.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
